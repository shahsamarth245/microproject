<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MyProfile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header .logo {
            color: #38bdf8;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .login-header h2 {
            color: #1e3a8a;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #666;
            font-size: 14px;
        }

        .demo-credentials {
            background: #f0f9ff;
            border: 1px solid #38bdf8;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #1e3a8a;
        }

        .demo-credentials strong {
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            color: #555;
        }

        .form-options input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: #38bdf8;
        }

        .form-options a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }

        .form-options a:hover {
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #2563eb, #38bdf8);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        .register-link a {
            color: #38bdf8;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border: 1px solid #fecaca;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">MyProfile</div>
            <h2>Welcome Back</h2>
            <p>Sign in to access your profile</p>
        </div>

        <div class="demo-credentials">
            <strong>Demo Credentials:</strong><br>
            Email: <strong>demo@myprofile.com</strong><br>
            Password: <strong>demo123</strong>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" id="remember" name="remember"> Remember me
                </label>
                <a href="#" id="forgotPassword">Forgot password?</a>
            </div>

            <button type="submit" class="btn-login">Sign In</button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="register.html">Create your profile</a>
        </div>
    </div>

    <script>
        // Demo credentials
        const DEMO_CREDENTIALS = {
            email: 'demo@myprofile.com',
            password: 'demo123'
        };

        // Check if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = sessionStorage.getItem('isLoggedIn');
            const currentUser = sessionStorage.getItem('currentUser');
            
            if (isLoggedIn === 'true' && currentUser) {
                window.location.href = 'profile.html';
            }

            // Pre-fill demo credentials if "remember me" was checked
            const rememberedEmail = localStorage.getItem('rememberedEmail');
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('remember').checked = true;
            }
        });

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const errorEl = document.getElementById('errorMessage');

            // Hide previous error
            errorEl.classList.remove('show');

            // Validate demo credentials
            if (email === DEMO_CREDENTIALS.email && password === DEMO_CREDENTIALS.password) {
                // Check if demo user exists in localStorage, if not create it
                let users = JSON.parse(localStorage.getItem('myprofile_users') || '[]');
                let demoUser = users.find(u => u.email === DEMO_CREDENTIALS.email);
                
                if (!demoUser) {
                    // Create demo user profile
                    demoUser = {
                        id: 'demo_user',
                        name: 'Shubh Gupta',
                        email: DEMO_CREDENTIALS.email,
                        password: DEMO_CREDENTIALS.password,
                        title: 'Student | Programmer | Web Development Enthusiast',
                        bio: "Hello! My name is Shubh. I am an enthusiastic engineering student interested in programming, web development and technology. I enjoy learning new skills, creating projects and solving problems using technology.\n\nMy goal is to continuously improve my technical knowledge and develop useful and creative applications.",
                        education: [
                            { degree: 'Engineering', institution: 'Madhav Institute of Technology & Science, Gwalior', field: 'Computer Science Technology' },
                            { degree: 'Class XII', institution: 'CBSE', field: 'Science Stream' },
                            { degree: 'Class X', institution: 'CBSE', field: 'Secondary Education' }
                        ],
                        skills: [
                            { name: 'HTML', level: 90 },
                            { name: 'CSS', level: 80 },
                            { name: 'C++', level: 70 },
                            { name: 'Communication', level: 85 }
                        ],
                        projects: [
                            { name: 'Personal Website', description: 'A responsive personal portfolio website created using HTML and CSS.' },
                            { name: 'Student Login Page', description: 'A modern student login interface designed using HTML and CSS.' },
                            { name: 'Quiz Website', description: 'An interactive MCQ-based quiz interface for students.' }
                        ],
                        profileImage: 'C:\\Users\\Acer\\Downloads\\WhatsApp Image 2026-02-05 at 23.13.39 (1).jpeg',
                        createdAt: new Date().toISOString()
                    };
                    users.push(demoUser);
                    localStorage.setItem('myprofile_users', JSON.stringify(users));
                }

                // Save session
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('currentUser', JSON.stringify({
                    id: demoUser.id,
                    name: demoUser.name,
                    email: demoUser.email
                }));

                // Remember email if checked
                if (remember) {
                    localStorage.setItem('rememberedEmail', email);
                } else {
                    localStorage.removeItem('rememberedEmail');
                }

                // Redirect to profile
                window.location.href = 'profile.html';
            } else {
                // Check if user exists in localStorage (registered users)
                const users = JSON.parse(localStorage.getItem('myprofile_users') || '[]');
                const user = users.find(u => u.email === email && u.password === password);
                
                if (user) {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('currentUser', JSON.stringify({
                        id: user.id,
                        name: user.name,
                        email: user.email
                    }));

                    if (remember) {
                        localStorage.setItem('rememberedEmail', email);
                    } else {
                        localStorage.removeItem('rememberedEmail');
                    }

                    window.location.href = 'profile.html';
                } else {
                    errorEl.textContent = 'Invalid email or password. Please try again.';
                    errorEl.classList.add('show');
                }
            }
        });

        // Forgot password (demo)
        document.getElementById('forgotPassword').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Demo mode: Use email "demo@myprofile.com" and password "demo123"\n\nFor registered accounts, please remember your credentials.');
        });
    </script>
</body>
</html>
